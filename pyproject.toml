[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanframe-robotics"
version = "0.1.0"
description = "Clean Flask and robot-domain foundation for HumanFrame Robotics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Login>=0.6,<1",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-WTF>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robot*", "system*"]
exclude = ["old*", "tests*"]
